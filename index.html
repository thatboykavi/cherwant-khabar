<style>
  :root {
    --ink: #12161d;
    --ink-panel: #191f29;
    --paper: #f6f3ec;
    --paper-dim: #ece7db;
    --line: #2a3140;
    --line-light: #ddd6c4;
    --red: #d84b3a;
    --teal: #3f7d78;
    --gold: #d3a04a;
    --text-light: #eef0ee;
    --text-dim: #8a93a3;
    --text-dark: #1c1f18;
    --text-dark-dim: #6b6a5c;
    --radius-sm: 4px;
    --radius-md: 10px;
  }

  * { box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    margin: 0;
    background: var(--ink);
    color: var(--text-light);
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, h3, .headline-font {
    font-family: 'Fraunces', Georgia, serif;
  }

  a { color: inherit; }

  button {
    font-family: inherit;
    cursor: pointer;
    border: none;
  }

  button:focus-visible, input:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 2px;
  }

  /* ---------- Ticker ---------- */
  .ticker-bar {
    background: var(--red);
    color: #fff;
    overflow: hidden;
    white-space: nowrap;
    display: flex;
    align-items: center;
    height: 34px;
  }

  .ticker-tag {
    flex: 0 0 auto;
    background: #a83527;
    padding: 0 14px;
    height: 100%;
    display: flex;
    align-items: center;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.06em;
  }

  .ticker-track-wrap {
    flex: 1;
    overflow: hidden;
  }

  .ticker-track {
    display: inline-flex;
    white-space: nowrap;
    animation: scrollTicker 32s linear infinite;
    padding-left: 100%;
  }

  .ticker-track span {
    margin-right: 48px;
    font-size: 13px;
    font-weight: 500;
  }

  @keyframes scrollTicker {
    from { transform: translateX(0); }
    to { transform: translateX(-100%); }
  }

  /* ---------- Masthead ---------- */
  .masthead {
    background: var(--ink);
    border-bottom: 1px solid var(--line);
    padding: 22px 5vw 18px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 16px;
  }

  .masthead-left {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .logo-mark {
    width: 56px;
    height: 56px;
    aspect-ratio: 1 / 1;
    border-radius: 50%;
    overflow: hidden;
    flex: none;
    background: linear-gradient(135deg, var(--red), var(--gold));
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 14px rgba(0,0,0,0.35);
    border: 2px solid rgba(255,255,255,0.08);
  }

  .logo-mark img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    border-radius: 50%;
  }

  .logo-mark .logo-fallback {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 700;
    font-size: 22px;
    color: #fff;
  }

  .masthead-title {
    font-size: clamp(30px, 4.5vw, 46px);
    font-weight: 700;
    margin: 0;
    letter-spacing: -0.01em;
    line-height: 1;
  }

  .masthead-sub {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 8px;
  }

  .masthead-right {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .clock-block {
    text-align: right;
    font-family: 'JetBrains Mono', monospace;
  }

  .clock-time {
    font-size: 20px;
    font-weight: 500;
    color: var(--text-light);
  }

  .clock-date {
    font-size: 12px;
    color: var(--text-dim);
  }

  .btn {
    border-radius: var(--radius-sm);
    padding: 10px 16px;
    font-size: 13px;
    font-weight: 600;
    transition: transform 0.12s ease, background 0.15s ease;
  }

  .btn:active { transform: scale(0.96); }

  .btn-primary {
    background: var(--red);
    color: #fff;
  }
  .btn-primary:hover { background: #c33f2f; }

  .btn-outline {
    background: transparent;
    color: var(--text-light);
    border: 1px solid var(--line);
  }
  .btn-outline:hover { border-color: var(--gold); color: var(--gold); }

  /* ---------- Section / filters ---------- */
  .section-bar {
    padding: 18px 5vw 0;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
  }

  .filter-chips {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
  }

  .search-wrap {
    position: relative;
    flex: 0 0 auto;
  }

  .search-wrap input {
    background: var(--ink-panel);
    border: 1px solid var(--line);
    color: var(--text-light);
    border-radius: 999px;
    padding: 8px 16px 8px 34px;
    font-size: 13px;
    width: 200px;
    transition: border-color 0.15s ease, width 0.2s ease;
  }
  .search-wrap input:focus { border-color: var(--gold); width: 240px; outline: none; }
  .search-wrap::before {
    content: '⌕';
    position: absolute;
    left: 13px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-dim);
    font-size: 15px;
    pointer-events: none;
  }

  .theme-toggle {
    background: var(--ink-panel);
    border: 1px solid var(--line);
    color: var(--text-light);
    width: 34px;
    height: 34px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    transition: border-color 0.15s ease, transform 0.2s ease;
  }
  .theme-toggle:hover { border-color: var(--gold); transform: rotate(20deg); }

  /* ---------- Light theme ---------- */
  body[data-theme="light"] {
    --ink: #f2ede1;
    --ink-panel: #e8e1d0;
    --line: #d8cfb8;
    --text-light: #201d15;
    --text-dim: #5c5646;
  }
  body[data-theme="light"] .card-tag { background: rgba(255,255,255,0.85); color: #1c1f18; }
  body[data-theme="light"] .ad-card { border-color: #a87a1f; }
  body[data-theme="light"] .toast { background: #201d15; }

  /* ---------- Breaking banner ---------- */
  .breaking-banner {
    background: var(--gold);
    color: #1a1300;
    display: none;
    align-items: center;
    gap: 12px;
    padding: 10px 5vw;
    font-size: 13.5px;
    font-weight: 600;
    animation: breakingIn 0.4s ease;
  }
  .breaking-banner.show { display: flex; }
  .breaking-banner .pulse-dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--red);
    flex: none;
    animation: pulseDot 1.1s ease-in-out infinite;
  }
  .breaking-banner .bb-close {
    margin-left: auto;
    background: transparent;
    color: #1a1300;
    font-size: 16px;
    opacity: 0.6;
    width: 24px; height: 24px;
    border-radius: 50%;
  }
  .breaking-banner .bb-close:hover { opacity: 1; background: rgba(0,0,0,0.08); }
  @keyframes breakingIn {
    from { transform: translateY(-100%); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  @keyframes pulseDot {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.6); opacity: 0.5; }
  }

  /* ---------- Comments ---------- */
  .comments-toggle {
    background: transparent;
    border: none;
    color: var(--text-dark-dim);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .comments-toggle:hover { color: var(--text-dark); }

  .comments-panel {
    display: none;
    border-top: 1px solid var(--line-light);
    padding: 12px 18px 16px;
    background: var(--paper-dim);
  }
  .comments-panel.open { display: block; animation: cardIn 0.3s ease forwards; }

  .comment-item {
    padding: 8px 0;
    border-bottom: 1px solid var(--line-light);
    font-size: 13px;
  }
  .comment-item:last-of-type { border-bottom: none; }
  .comment-author {
    font-weight: 600;
    font-size: 12px;
    color: var(--text-dark);
  }
  .comment-time {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    color: var(--text-dark-dim);
    margin-left: 6px;
  }
  .comment-text { margin: 3px 0 0; color: var(--text-dark-dim); }

  .comment-form {
    display: flex;
    gap: 6px;
    margin-top: 10px;
    flex-wrap: wrap;
  }
  .comment-form input[type="text"] {
    flex: 1 1 100px;
    min-width: 90px;
    padding: 7px 10px;
    border: 1px solid var(--line-light);
    border-radius: var(--radius-sm);
    font-size: 12.5px;
    font-family: inherit;
  }
  .comment-form input[type="text"].comment-body { flex: 2 1 160px; }
  .comment-form button {
    background: var(--teal);
    color: #fff;
    border-radius: var(--radius-sm);
    padding: 7px 14px;
    font-size: 12.5px;
    font-weight: 600;
  }
  .comment-form button:hover { background: #366863; }

  .no-comments {
    font-size: 12.5px;
    color: var(--text-dark-dim);
    font-style: italic;
    margin: 0 0 8px;
  }

  .view-count {
    display: inline-flex;
    align-items: center;
    gap: 3px;
  }

  /* ---------- Rich text toolbar ---------- */
  .rt-toolbar {
    display: flex;
    gap: 6px;
    margin-bottom: 6px;
  }
  .rt-toolbar button {
    background: var(--paper-dim);
    color: var(--text-dark);
    border-radius: var(--radius-sm);
    width: 30px;
    height: 28px;
    font-size: 13px;
    font-weight: 700;
  }
  .rt-toolbar button:hover { background: var(--line-light); }
  .rt-hint {
    font-size: 11px;
    color: var(--text-dark-dim);
    margin: 4px 0 0;
  }
  .card-excerpt a, .ad-text a { color: var(--teal); text-decoration: underline; }

  .filter-chip {
    background: var(--ink-panel);
    border: 1px solid var(--line);
    color: var(--text-dim);
    border-radius: 999px;
    padding: 7px 16px;
    font-size: 12.5px;
    font-weight: 500;
    transition: all 0.15s ease;
  }

  .filter-chip.active {
    background: var(--gold);
    border-color: var(--gold);
    color: #1a1300;
  }

  .filter-chip:hover:not(.active) {
    border-color: var(--gold);
    color: var(--gold);
  }

  /* ---------- Feed ---------- */
  .feed {
    padding: 24px 5vw 80px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 22px;
  }

  @media (max-width: 900px) {
    .feed { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 600px) {
    .feed { grid-template-columns: 1fr; }
  }

  .card {
    background: var(--paper);
    color: var(--text-dark);
    border-radius: var(--radius-md);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
    opacity: 0;
    transform: translateY(18px);
    animation: cardIn 0.55s ease forwards;
  }

  .card.featured {
    grid-column: span 2;
    grid-row: span 2;
  }
  @media (max-width: 600px) {
    .card.featured { grid-column: span 1; }
  }

  @keyframes cardIn {
    to { opacity: 1; transform: translateY(0); }
  }

  .card-media {
    position: relative;
    aspect-ratio: 16 / 10;
    overflow: hidden;
    background: linear-gradient(135deg, var(--c1, #3f7d78), var(--c2, #12161d));
  }

  .card.featured .card-media { aspect-ratio: 16 / 9; }

  .card-media img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    animation: kenburns 14s ease-in-out infinite alternate;
  }

  @keyframes kenburns {
    from { transform: scale(1); }
    to { transform: scale(1.09); }
  }

  .card-tag {
    position: absolute;
    top: 12px;
    left: 12px;
    background: rgba(18,22,29,0.82);
    color: #fff;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.03em;
    padding: 5px 10px;
    border-radius: var(--radius-sm);
  }

  .card-body {
    padding: 16px 18px 18px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex: 1;
  }

  .card-headline {
    font-size: 18px;
    line-height: 1.28;
    font-weight: 600;
    margin: 0;
  }

  .card.featured .card-headline {
    font-size: clamp(22px, 2.4vw, 30px);
  }

  .card-excerpt {
    font-size: 13.5px;
    color: var(--text-dark-dim);
    line-height: 1.5;
    margin: 0;
    flex: 1;
  }

  .card-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-dark-dim);
    border-top: 1px solid var(--line-light);
    padding-top: 10px;
    margin-top: 4px;
  }

  .card-actions {
    display: flex;
    gap: 6px;
  }

  .icon-btn {
    background: transparent;
    color: var(--text-dark-dim);
    width: 26px;
    height: 26px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .icon-btn:hover { background: var(--paper-dim); color: var(--text-dark); }
  .icon-btn.danger:hover { background: #f0d5d0; color: var(--red); }

  /* ---------- Ad card ---------- */
  .ad-card {
    background: var(--ink-panel);
    border: 1px dashed var(--gold);
    border-radius: var(--radius-md);
    padding: 16px 18px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    position: relative;
    opacity: 0;
    transform: translateY(18px);
    animation: cardIn 0.55s ease forwards;
  }

  .ad-eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    color: var(--gold);
    letter-spacing: 0.04em;
  }

  .ad-title {
    font-size: 16px;
    font-weight: 600;
    margin: 0;
  }

  .ad-text {
    font-size: 13px;
    color: var(--text-dim);
    margin: 0;
    line-height: 1.5;
  }

  .ad-media {
    border-radius: var(--radius-sm);
    overflow: hidden;
    aspect-ratio: 16/9;
    background: linear-gradient(135deg, var(--gold), #7a5a20);
  }
  .ad-media img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .ad-link {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--gold);
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }

  /* ---------- Empty state ---------- */
  .empty-state {
    grid-column: 1 / -1;
    text-align: center;
    padding: 60px 20px;
    color: var(--text-dim);
  }
  .empty-state h3 { color: var(--text-light); margin-bottom: 8px; }

  /* ---------- Modal ---------- */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(10, 12, 16, 0.7);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
  }
  .overlay.open { display: flex; }

  .modal {
    background: var(--paper);
    color: var(--text-dark);
    width: 100%;
    max-width: 520px;
    max-height: 88vh;
    overflow-y: auto;
    border-radius: var(--radius-md);
    padding: 26px 26px 22px;
    animation: modalPop 0.22s cubic-bezier(.2,.9,.3,1.3);
  }

  @keyframes modalPop {
    from { opacity: 0; transform: scale(0.92) translateY(10px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }

  .modal h3 {
    margin: 0 0 18px;
    font-size: 22px;
  }

  .field {
    margin-bottom: 14px;
  }

  .field label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-dark-dim);
    margin-bottom: 6px;
    letter-spacing: 0.02em;
  }

  .field input, .field textarea, .field select {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--line-light);
    border-radius: var(--radius-sm);
    font-size: 14px;
    font-family: inherit;
    background: #fff;
    color: var(--text-dark);
  }

  .field textarea { resize: vertical; min-height: 80px; }

  .img-preview {
    margin-top: 8px;
    border-radius: var(--radius-sm);
    overflow: hidden;
    aspect-ratio: 16/9;
    background: var(--paper-dim);
    display: none;
  }
  .img-preview.show { display: block; }
  .img-preview img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 18px;
  }

  .modal-actions .btn-outline {
    border-color: var(--line-light);
    color: var(--text-dark-dim);
  }
  .modal-actions .btn-outline:hover { border-color: var(--red); color: var(--red); }

  /* ---------- Toast ---------- */
  .toast-wrap {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 200;
    display: flex;
    flex-direction: column;
    gap: 8px;
    align-items: center;
  }

  .toast {
    background: #1c1f18;
    color: #fff;
    padding: 11px 20px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 500;
    box-shadow: 0 8px 24px rgba(0,0,0,0.35);
    animation: toastIn 0.3s ease, toastOut 0.3s ease 2.4s forwards;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  @keyframes toastIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes toastOut {
    to { opacity: 0; transform: translateY(-8px); }
  }

  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--gold); flex: none; }

  footer {
    text-align: center;
    color: var(--text-dim);
    font-size: 12px;
    padding: 24px;
    border-top: 1px solid var(--line);
    font-family: 'JetBrains Mono', monospace;
  }
</style>
</head>

<!-- News Modal -->
<div class="overlay" id="newsOverlay">

    <h3 id="newsModalTitle">Publish a story</h3>
    <input type="hidden" id="newsId">
    <div class="field">

      <input type="text" id="newsCategory" placeholder="World, Tech, Sports…" required>

    <div class="field">
      <label for="newsHeadline">Headline</label>
      <input type="text" id="newsHeadline" placeholder="Write the headline" required>
    </div>
    <div class="field">
      <label for="newsExcerpt">Story</label>
      <div class="rt-toolbar">
        <button type="button" data-wrap="**" title="Bold"><b>B</b></button>
        <button type="button" data-wrap="*" title="Italic"><i>I</i></button>
        <button type="button" id="rtLinkBtn" title="Link">🔗</button>
      </div>
      <textarea id="newsExcerpt" placeholder="What happened?" required></textarea>
      <p class="rt-hint">Select text and click B / I to format, or 🔗 to add a link.</p>
    </div>
    <div class="field">
      <label for="newsImage">Image or GIF URL (optional)</label>
      <input type="url" id="newsImage" placeholder="https://… (.jpg, .png or .gif)">
      <div class="img-preview" id="newsImagePreview"></div>

      <button type="submit" class="btn btn-primary" id="saveNewsBtn">Publish</button>

  </form>
</div>

<script>
(function () {
  const STORAGE_KEY_NEWS = 'wiredesk_news_v1';
  const STORAGE_KEY_ADS = 'wiredesk_ads_v1';
  const STORAGE_KEY_VIEWS = 'wiredesk_views_v1';
  const STORAGE_KEY_COMMENTS = 'wiredesk_comments_v1';
  const STORAGE_KEY_THEME = 'wiredesk_theme_v1';
  const STORAGE_KEY_LAST_SEEN = 'wiredesk_lastseen_v1';

  const gradients = [
    ['#3f7d78', '#12161d'], ['#d84b3a', '#241010'], ['#4a5fd3', '#0d1220'],
    ['#d3a04a', '#241a08'], ['#7a3fd3', '#160d24'], ['#3fa0d3', '#0d1a24']
  ];

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

  function load(key, fallback) {
    try {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch (e) { return fallback; }
  }

  function save(key, data) {
    localStorage.setItem(key, JSON.stringify(data));
  }

  function seedData() {
    const news = [
      {
        id: uid(), category: 'Tech', featured: true,
        headline: 'This is your newsroom — publish your first real story',
        excerpt: 'Click "+ Publish" above to replace this with your own headline, story text, and image. Everything below updates automatically: timestamps, layout, and animations.',
        image: '', createdAt: Date.now() - 1000 * 60 * 5
      },
      {
        id: uid(), category: 'Guide', featured: false,
        headline: 'Editing and deleting your stories',
        excerpt: 'Hover any card to reveal edit and delete controls in the bottom-right corner of each story.',
        image: '', createdAt: Date.now() - 1000 * 60 * 40
      },
      {
        id: uid(), category: 'Guide', featured: false,
        headline: 'Sharing works out of the box',
        excerpt: "The share button uses your device's native share sheet where available, and falls back to copying the story to your clipboard. Paste any image or GIF URL into a story or ad and it'll show up automatically.",
        image: '', createdAt: Date.now() - 1000 * 60 * 90
      }
    ];
    const ads = [
      {
        id: uid(), title: 'Advertise here',
        text: 'Click "+ Ad" to add a sponsor slot — it will appear woven into the feed automatically.',
        image: '', link: ''
      }
    ];
    save(STORAGE_KEY_NEWS, news);
    save(STORAGE_KEY_ADS, ads);
  }

  if (localStorage.getItem(STORAGE_KEY_NEWS) === null) seedData();

  let newsList = load(STORAGE_KEY_NEWS, []);
  let adsList = load(STORAGE_KEY_ADS, []);
  let viewCounts = load(STORAGE_KEY_VIEWS, {});
  let commentsMap = load(STORAGE_KEY_COMMENTS, {});
  let activeFilter = 'All';
  let searchQuery = '';
  const countedThisSession = new Set();
  const openCommentPanels = new Set();

  function getViews(id) { return viewCounts[id] || 0; }
  function getComments(id) { return commentsMap[id] || []; }

  // ---------- Clock ----------
  function tickClock() {
    const now = new Date();
    document.getElementById('clockTime').textContent = now.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    document.getElementById('clockDate').textContent = now.toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    document.getElementById('editionLine').textContent =
      'EDITION · ' + now.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }).toUpperCase();
  }
  tickClock();
  setInterval(tickClock, 1000);

  // ---------- Relative time ----------
  function relativeTime(ts) {
    const diff = Math.max(0, Date.now() - ts);
    const m = Math.floor(diff / 60000);
    if (m < 1) return 'just now';
    if (m < 60) return m + 'm ago';
    const h = Math.floor(m / 60);
    if (h < 24) return h + 'h ago';
    const d = Math.floor(h / 24);
    return d + 'd ago';
  }

  // ---------- Toast ----------
  function toast(msg) {
    const wrap = document.getElementById('toastWrap');
    const el = document.createElement('div');
    el.className = 'toast';
    el.innerHTML = '<span class="dot"></span><span>' + msg + '</span>';
    wrap.appendChild(el);
    setTimeout(() => el.remove(), 2900);
  }

  // ---------- Escaping ----------
  function esc(str) {
    const d = document.createElement('div');
    d.textContent = str || '';
    return d.innerHTML;
  }

  // ---------- Lightweight rich text (bold/italic/links) ----------
  function richText(str) {
    let out = esc(str);
    out = out.replace(/\[([^\[\]]+)\]\((https?:\/\/[^\s()]+)\)/g, function (m, label, url) {
      return '<a href="' + url + '" target="_blank" rel="noopener">' + label + '</a>';
    });
    out = out.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    out = out.replace(/\*([^*]+)\*/g, '<em>$1</em>');
    return out;
  }

  function wireRichTextToolbar() {
    const textarea = document.getElementById('newsExcerpt');
    document.querySelectorAll('.rt-toolbar [data-wrap]').forEach(btn => {
      btn.addEventListener('click', () => {
        const token = btn.dataset.wrap;
        const start = textarea.selectionStart;
        const end = textarea.selectionEnd;
        const selected = textarea.value.slice(start, end) || 'text';
        const before = textarea.value.slice(0, start);
        const after = textarea.value.slice(end);
        textarea.value = before + token + selected + token + after;
        textarea.focus();
        textarea.selectionStart = start + token.length;
        textarea.selectionEnd = start + token.length + selected.length;
      });
    });
    document.getElementById('rtLinkBtn').addEventListener('click', () => {
      const start = textarea.selectionStart;
      const end = textarea.selectionEnd;
      const selected = textarea.value.slice(start, end) || 'link text';
      const url = prompt('Link URL:', 'https://');
      if (!url) return;
      const before = textarea.value.slice(0, start);
      const after = textarea.value.slice(end);
      const inserted = '[' + selected + '](' + url + ')';
      textarea.value = before + inserted + after;
      textarea.focus();
    });
  }

  // ---------- Ticker ----------
  function renderTicker() {
    const track = document.getElementById('tickerTrack');
    if (newsList.length === 0) {
      track.innerHTML = '<span>Publish your first story to see it appear in the live ticker.</span>';
      return;
    }
    const sorted = [...newsList].sort((a, b) => b.createdAt - a.createdAt);
    track.innerHTML = sorted.map(n => '<span>' + esc(n.category.toUpperCase()) + ' — ' + esc(n.headline) + '</span>').join('');
  }

  // ---------- Filters ----------
  function renderFilters() {
    const bar = document.getElementById('filterBar');
    const cats = ['All', ...new Set(newsList.map(n => n.category))];
    bar.innerHTML = cats.map(c =>
      '<button class="filter-chip' + (c === activeFilter ? ' active' : '') + '" data-cat="' + esc(c) + '">' + esc(c) + '</button>'
    ).join('');
    bar.querySelectorAll('.filter-chip').forEach(btn => {
      btn.addEventListener('click', () => {
        activeFilter = btn.dataset.cat;
        renderFilters();
        renderFeed();
      });
    });
  }

  // ---------- Feed ----------
  function shareItem(item) {
    const text = item.headline + '\n\n' + item.excerpt + '\n\n— shared from Cherwant Khabar';
    if (navigator.share) {
      navigator.share({ title: item.headline, text: text }).catch(() => {});
    } else {
      navigator.clipboard.writeText(text).then(() => toast('Story copied to clipboard'));
    }
  }

  function hashCode(str) {
    let h = 0;
    for (let i = 0; i < str.length; i++) { h = ((h << 5) - h) + str.charCodeAt(i); h |= 0; }
    return h;
  }

  function cardMedia(item) {
    const [c1, c2] = gradients[Math.abs(hashCode(item.id)) % gradients.length];
    const style = 'style="--c1:' + c1 + ';--c2:' + c2 + '"';
    if (item.image) {
      return '<div class="card-media" ' + style + '><img src="' + esc(item.image) + '" alt="" onerror="this.style.display=\'none\'"><span class="card-tag">' + esc(item.category) + '</span></div>';
    }
    return '<div class="card-media" ' + style + '><span class="card-tag">' + esc(item.category) + '</span></div>';
  }

  function newsCardHTML(item, isFeatured) {
    const views = getViews(item.id);
    const comments = getComments(item.id);
    return (
      '<article class="card' + (isFeatured ? ' featured' : '') + '" data-id="' + item.id + '">' +
        cardMedia(item) +
        '<div class="card-body">' +
          '<h2 class="card-headline">' + esc(item.headline) + '</h2>' +
          '<p class="card-excerpt">' + richText(item.excerpt) + '</p>' +
          '<div class="card-meta">' +
            '<span>' + relativeTime(item.createdAt) + ' &middot; <span class="view-count">&#128065; <span data-view-el="' + item.id + '">' + views + '</span></span></span>' +
            '<div class="card-actions">' +
              '<button class="icon-btn" title="Comments" data-action="toggle-comments" data-id="' + item.id + '">&#128172;</button>' +
              '<button class="icon-btn" title="Share" data-action="share" data-id="' + item.id + '">&#8599;</button>' +
              '<button class="icon-btn" title="Edit" data-action="edit-news" data-id="' + item.id + '">&#9998;</button>' +
              '<button class="icon-btn danger" title="Delete" data-action="delete-news" data-id="' + item.id + '">&times;</button>' +
            '</div>' +
          '</div>' +
        '</div>' +
        '<div class="comments-panel" id="comments-' + item.id + '">' +
          (comments.length
            ? comments.map(c =>
                '<div class="comment-item"><span class="comment-author">' + esc(c.name) + '</span><span class="comment-time">' + relativeTime(c.ts) + '</span><p class="comment-text">' + esc(c.text) + '</p></div>'
              ).join('')
            : '<p class="no-comments">No comments yet — be the first.</p>') +
          '<div class="comment-form">' +
            '<input type="text" class="comment-name" placeholder="Name" data-id="' + item.id + '">' +
            '<input type="text" class="comment-body" placeholder="Write a comment…" data-id="' + item.id + '">' +
            '<button type="button" data-action="add-comment" data-id="' + item.id + '">Post</button>' +
          '</div>' +
        '</div>' +
      '</article>'
    );
  }

  function adCardHTML(item) {
    return (
      '<article class="ad-card" data-id="' + item.id + '">' +
        '<div class="ad-eyebrow">Sponsored</div>' +
        (item.image ? '<div class="ad-media"><img src="' + esc(item.image) + '" alt="" onerror="this.parentElement.style.display=\'none\'"></div>' : '') +
        '<h3 class="ad-title">' + esc(item.title) + '</h3>' +
        '<p class="ad-text">' + richText(item.text) + '</p>' +
        (item.link ? '<a class="ad-link" href="' + esc(item.link) + '" target="_blank" rel="noopener">Learn more &#8594;</a>' : '') +
        '<div class="card-actions" style="margin-top:4px;">' +
          '<button class="icon-btn" title="Edit" data-action="edit-ad" data-id="' + item.id + '" style="color:var(--gold)">&#9998;</button>' +
          '<button class="icon-btn danger" title="Delete" data-action="delete-ad" data-id="' + item.id + '" style="color:var(--gold)">&times;</button>' +
        '</div>' +
      '</article>'
    );
  }

  function renderFeed() {
    const feed = document.getElementById('feed');
    let list = [...newsList].sort((a, b) => b.createdAt - a.createdAt);
    if (activeFilter !== 'All') list = list.filter(n => n.category === activeFilter);
    if (searchQuery.trim()) {
      const q = searchQuery.trim().toLowerCase();
      list = list.filter(n =>
        n.headline.toLowerCase().includes(q) ||
        n.excerpt.toLowerCase().includes(q) ||
        n.category.toLowerCase().includes(q)
      );
    }

    if (list.length === 0 && adsList.length === 0) {
      feed.innerHTML = '<div class="empty-state"><h3>Nothing published yet</h3><p>Use "+ Publish" above to add your first story.</p></div>';
      return;
    }
    if (list.length === 0) {
      feed.innerHTML = '<div class="empty-state"><h3>No stories match</h3><p>Try a different search or filter.</p></div>';
      return;
    }

    const featuredIdx = list.findIndex(n => n.featured);
    let html = '';
    let adIdx = 0;
    list.forEach((item, i) => {
      html += newsCardHTML(item, i === featuredIdx);
      if ((i + 1) % 4 === 0 && adsList.length) {
        html += adCardHTML(adsList[adIdx % adsList.length]);
        adIdx++;
      }
    });
    if (adsList.length && featuredIdx === -1 && list.length < 4) {
      html += adCardHTML(adsList[0]);
    }

    feed.innerHTML = html;

    feed.querySelectorAll('.card, .ad-card').forEach((el, i) => {
      el.style.animationDelay = (i * 0.06) + 's';
    });

    feed.querySelectorAll('.comments-panel').forEach(panel => {
      const pid = panel.id.replace('comments-', '');
      if (openCommentPanels.has(pid)) panel.classList.add('open');
    });

    // Count a view once per article per browser session
    list.forEach(item => {
      if (!countedThisSession.has(item.id)) {
        countedThisSession.add(item.id);
        viewCounts[item.id] = (viewCounts[item.id] || 0) + 1;
        save(STORAGE_KEY_VIEWS, viewCounts);
        const el = feed.querySelector('[data-view-el="' + item.id + '"]');
        if (el) el.textContent = viewCounts[item.id];
      }
    });

    feed.querySelectorAll('[data-action]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.preventDefault();
        const id = btn.dataset.id;
        const action = btn.dataset.action;
        if (action === 'share') {
          const item = newsList.find(n => n.id === id);
          if (item) shareItem(item);
        } else if (action === 'edit-news') {
          openNewsModal(newsList.find(n => n.id === id));
        } else if (action === 'delete-news') {
          if (confirm('Delete this story?')) {
            newsList = newsList.filter(n => n.id !== id);
            delete viewCounts[id];
            delete commentsMap[id];
            save(STORAGE_KEY_NEWS, newsList);
            save(STORAGE_KEY_VIEWS, viewCounts);
            save(STORAGE_KEY_COMMENTS, commentsMap);
            renderAll();
            toast('Story deleted');
          }
        } else if (action === 'edit-ad') {
          openAdModal(adsList.find(a => a.id === id));
        } else if (action === 'delete-ad') {
          if (confirm('Delete this ad?')) {
            adsList = adsList.filter(a => a.id !== id);
            save(STORAGE_KEY_ADS, adsList);
            renderAll();
            toast('Ad deleted');
          }
        } else if (action === 'toggle-comments') {
          const panel = document.getElementById('comments-' + id);
          if (panel) {
            panel.classList.toggle('open');
            if (panel.classList.contains('open')) openCommentPanels.add(id);
            else openCommentPanels.delete(id);
          }
        } else if (action === 'add-comment') {
          const panel = document.getElementById('comments-' + id);
          const nameInput = panel.querySelector('.comment-name');
          const bodyInput = panel.querySelector('.comment-body');
          const text = bodyInput.value.trim();
          if (!text) return;
          const name = nameInput.value.trim() || 'Anonymous';
          if (!commentsMap[id]) commentsMap[id] = [];
          commentsMap[id].push({ name, text, ts: Date.now() });
          save(STORAGE_KEY_COMMENTS, commentsMap);
          openCommentPanels.add(id);
          renderFeed();
          toast('Comment posted');
        }
      });
    });
  }

  function renderAll() {
    renderTicker();
    renderFilters();
    renderFeed();
  }

  // ---------- News modal ----------
  const newsOverlay = document.getElementById('newsOverlay');
  const newsForm = document.getElementById('newsForm');

  function openNewsModal(item) {
    document.getElementById('newsModalTitle').textContent = item ? 'Edit story' : 'Publish a story';
    document.getElementById('saveNewsBtn').textContent = item ? 'Save changes' : 'Publish';
    document.getElementById('newsId').value = item ? item.id : '';
    document.getElementById('newsCategory').value = item ? item.category : '';
    document.getElementById('newsHeadline').value = item ? item.headline : '';
    document.getElementById('newsExcerpt').value = item ? item.excerpt : '';
    document.getElementById('newsImage').value = item ? item.image : '';
    document.getElementById('newsFeatured').checked = item ? !!item.featured : false;
    const npv = document.getElementById('newsImagePreview');
    if (item && item.image) { npv.innerHTML = '<img src="' + esc(item.image) + '" alt="">'; npv.classList.add('show'); }
    else { npv.innerHTML = ''; npv.classList.remove('show'); }
    newsOverlay.classList.add('open');
    document.getElementById('newsCategory').focus();
  }
  function closeNewsModal() { newsOverlay.classList.remove('open'); newsForm.reset(); }

  document.getElementById('openNewsBtn').addEventListener('click', () => openNewsModal(null));
  document.getElementById('cancelNewsBtn').addEventListener('click', closeNewsModal);
  newsOverlay.addEventListener('click', (e) => { if (e.target === newsOverlay) closeNewsModal(); });

  newsForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const id = document.getElementById('newsId').value;
    const featured = document.getElementById('newsFeatured').checked;
    const data = {
      category: document.getElementById('newsCategory').value.trim() || 'General',
      headline: document.getElementById('newsHeadline').value.trim(),
      excerpt: document.getElementById('newsExcerpt').value.trim(),
      image: document.getElementById('newsImage').value.trim(),
      featured
    };
    if (featured) newsList.forEach(n => n.featured = false);

    if (id) {
      const idx = newsList.findIndex(n => n.id === id);
      if (idx > -1) newsList[idx] = { ...newsList[idx], ...data };
      toast('Story updated');
    } else {
      newsList.push({ id: uid(), createdAt: Date.now(), ...data });
      toast('Story published');
      save(STORAGE_KEY_NEWS, newsList);
      closeNewsModal();
      renderAll();
      maybeShowBreaking();
      return;
    }
    save(STORAGE_KEY_NEWS, newsList);
    closeNewsModal();
    renderAll();
  });

  // ---------- Ad modal ----------
  const adOverlay = document.getElementById('adOverlay');
  const adForm = document.getElementById('adForm');

  function openAdModal(item) {
    document.getElementById('adModalTitle').textContent = item ? 'Edit advertisement' : 'Add an advertisement';
    document.getElementById('saveAdBtn').textContent = item ? 'Save changes' : 'Save ad';
    document.getElementById('adId').value = item ? item.id : '';
    document.getElementById('adTitle').value = item ? item.title : '';
    document.getElementById('adText').value = item ? item.text : '';
    document.getElementById('adImage').value = item ? item.image : '';
    document.getElementById('adLink').value = item ? item.link : '';
    const apv = document.getElementById('adImagePreview');
    if (item && item.image) { apv.innerHTML = '<img src="' + esc(item.image) + '" alt="">'; apv.classList.add('show'); }
    else { apv.innerHTML = ''; apv.classList.remove('show'); }
    adOverlay.classList.add('open');
    document.getElementById('adTitle').focus();
  }
  function closeAdModal() { adOverlay.classList.remove('open'); adForm.reset(); }

  document.getElementById('openAdBtn').addEventListener('click', () => openAdModal(null));
  document.getElementById('cancelAdBtn').addEventListener('click', closeAdModal);
  adOverlay.addEventListener('click', (e) => { if (e.target === adOverlay) closeAdModal(); });

  adForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const id = document.getElementById('adId').value;
    const data = {
      title: document.getElementById('adTitle').value.trim(),
      text: document.getElementById('adText').value.trim(),
      image: document.getElementById('adImage').value.trim(),
      link: document.getElementById('adLink').value.trim()
    };
    if (id) {
      const idx = adsList.findIndex(a => a.id === id);
      if (idx > -1) adsList[idx] = { ...adsList[idx], ...data };
      toast('Ad updated');
    } else {
      adsList.push({ id: uid(), ...data });
      toast('Ad added');
    }
    save(STORAGE_KEY_ADS, adsList);
    closeAdModal();
    renderAll();
  });

  // ---------- Live image/GIF previews ----------
  function wirePreview(inputId, previewId) {
    const input = document.getElementById(inputId);
    const preview = document.getElementById(previewId);
    function update() {
      const url = input.value.trim();
      if (url) {
        preview.innerHTML = '<img src="' + esc(url) + '" alt="" onerror="this.parentElement.classList.remove(\'show\')" onload="this.parentElement.classList.add(\'show\')">';
      } else {
        preview.classList.remove('show');
        preview.innerHTML = '';
      }
    }
    input.addEventListener('input', update);
  }
  wirePreview('newsImage', 'newsImagePreview');
  wirePreview('adImage', 'adImagePreview');
  wireRichTextToolbar();

  // ---------- Search ----------
  document.getElementById('searchInput').addEventListener('input', (e) => {
    searchQuery = e.target.value;
    renderFeed();
  });

  // ---------- Theme toggle ----------
  const themeToggle = document.getElementById('themeToggle');
  function applyTheme(theme) {
    document.body.setAttribute('data-theme', theme);
    themeToggle.textContent = theme === 'light' ? '☀' : '☾';
  }
  applyTheme(load(STORAGE_KEY_THEME, 'dark'));
  themeToggle.addEventListener('click', () => {
    const current = document.body.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
    const next = current === 'light' ? 'dark' : 'light';
    applyTheme(next);
    save(STORAGE_KEY_THEME, next);
  });

  // ---------- Breaking news banner ----------
  // Shows once per browser session if the newest story was published after
  // the last time this browser closed the banner (avoids repeating on every reload).
  let breakingDismissTimer = null;
  function showBreakingBanner(text) {
    document.getElementById('breakingText').textContent = text;
    document.getElementById('breakingBanner').classList.add('show');
    if (breakingDismissTimer) clearTimeout(breakingDismissTimer);
    breakingDismissTimer = setTimeout(dismissBreaking, 6000);
  }
  function maybeShowBreaking() {
    if (newsList.length === 0) return;
    const newest = [...newsList].sort((a, b) => b.createdAt - a.createdAt)[0];
    const lastSeen = Number(localStorage.getItem(STORAGE_KEY_LAST_SEEN) || 0);
    if (newest.createdAt > lastSeen) {
      showBreakingBanner('BREAKING — ' + newest.headline);
    }
  }
  function dismissBreaking() {
    document.getElementById('breakingBanner').classList.remove('show');
    localStorage.setItem(STORAGE_KEY_LAST_SEEN, String(Date.now()));
    if (breakingDismissTimer) { clearTimeout(breakingDismissTimer); breakingDismissTimer = null; }
  }
  document.getElementById('breakingClose').addEventListener('click', dismissBreaking);

  // ---------- Keyboard ----------
  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { closeNewsModal(); closeAdModal(); }
  });

  // ---------- Refresh relative timestamps periodically ----------
  setInterval(() => { renderFeed(); }, 60000);

  renderAll();
  maybeShowBreaking();
})();
</script>

</body>
</html>
